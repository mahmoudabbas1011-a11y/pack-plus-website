# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: mahmoudabbas1011-a11y/pack-plus-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/77560e05-8936-47a0-85e4-562df6b662fa/pkce
  auth_token_endpoint: /sites/77560e05-8936-47a0-85e4-562df6b662fa/token
  gateway_url: https://gateway.decapbridge.com

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://heroic-blini-b69b61.netlify.app

media_folder: "images"
public_folder: "images"

locale: "ar"

collections:
  - name: "products"
    label: "المنتجات"
    files:
      - name: "products_list"
        label: "كل المنتجات"
        file: "data/products.json"
        fields:
          - label: "المنتجات"
            name: "products"
            widget: "list"
            label_singular: "منتج"
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - label: "الفئة"
                name: "category"
                widget: "select"
                options:
                  - { label: "علب بلاستيك ووجبات", value: "containers" }
                  - { label: "أطباق وأدوات الفويل", value: "foil" }
                  - { label: "أكواب وأطباق ورقية", value: "cups" }
                  - { label: "أدوات مائدة وإكسسوارات", value: "cutlery" }
              - label: "صورة المنتج"
                name: "image"
                widget: "image"
              - label: "اسم المنتج"
                name: "name"
                widget: "string"
              - label: "المقاس"
                name: "size"
                widget: "string"
              - label: "سعر الكرتونة (جنيه)"
                name: "price"
                widget: "number"
                required: false
                value_type: "float"
                hint: "السعر ده مش هيظهر للعميل وهو بيتصفح — بيظهر بس جوه سلة الطلب"
              - label: "كمية الكرتونة"
                name: "carton_qty"
                widget: "string"
                required: false
                hint: "مثال: 500 قطعة"
