<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم Sphinx Pack</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#211D18">
  <link rel="icon" href="icon-192.png">

  <!-- iOS support for "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sphinx Pack أدمن">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    #splash{
      position:fixed; inset:0; z-index:99999; background:#211D18;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      animation: splashOut 0.5s ease 1.9s forwards;
    }
    #splash img{
      width:120px; height:auto;
      opacity:0; transform:scale(0.7);
      animation: logoIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.1s forwards;
    }
    #splash .brand{
      margin-top:22px; font-family: Arial, sans-serif; text-align:center;
      opacity:0; transform:translateY(10px);
      animation: textIn 0.5s ease 0.65s forwards;
    }
    #splash .brand strong{
      display:block; color:#EFECE4; font-size:22px; font-weight:900; letter-spacing:0.5px;
    }
    #splash .brand em{
      display:block; font-style:normal; color:#C99A6C; font-size:11px; font-weight:700;
      letter-spacing:4px; margin-top:4px;
    }
    @keyframes logoIn{ to{ opacity:1; transform:scale(1); } }
    @keyframes textIn{ to{ opacity:1; transform:translateY(0); } }
    @keyframes splashOut{ to{ opacity:0; visibility:hidden; pointer-events:none; } }

    /* تحسين بسيط وآمن لتجربة الموبايل جوه اللوحة نفسها */
    input, textarea, select, button{ font-size:16px !important; }
  </style>
</head>
<body>

  <div id="splash">
    <img src="../images/sphinx-logo.png" alt="Sphinx Pack">
    <div class="brand">
      <strong>سفينكس باك</strong>
      <em>SPHINX PACK</em>
    </div>
  </div>

  <!-- Include the Decap CMS script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('Service worker registration failed:', err);
      });
    }
    setTimeout(function(){
      var s = document.getElementById('splash');
      if (s) s.remove();
    }, 2600);
  </script>
</body>
</html>
